[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zoo-kcl-check-cli"
version = "0.1.6"
description = "Strict local checks for Zoo / KittyCAD KCL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["zoo-kcl==0.3.191"]

[project.urls]
Repository = "https://github.com/gavroman/zoo-kcl-check"
Issues = "https://github.com/gavroman/zoo-kcl-check/issues"

[project.scripts]
kcl-check = "zoo_kcl_check_cli.cli:main"

[project.optional-dependencies]
dev = ["build==1.6.1", "pytest==9.1.1", "ruff==0.17.0"]
binary = ["PyInstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/zoo_kcl_check_cli"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/packaging", "/scripts", "/docs", "/LICENSE", "/pyproject.toml", "/README.md", "/requirements.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["offline: requires macOS OS-level network sandbox", "binary: smoke tests for the built executable"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
